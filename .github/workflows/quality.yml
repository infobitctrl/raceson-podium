name: Source quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix contracts --ignore-scripts --no-audit --no-fund
      - run: npm run check:publication
      - run: npm run check:api
      - run: npm run check:web
      - run: npm run check:lint
      - run: npm run test:rewards:ui
      - run: npm run test:wallet
      - run: npm run check:rewards:chain
      - run: npm run check:dependencies
      - run: npm run check:build
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix contracts --audit-level=moderate

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix contracts --ignore-scripts --no-audit --no-fund
      - name: Start disposable PostgreSQL 16
        run: |
          sudo systemctl stop postgresql
          PG_BIN=/usr/lib/postgresql/16/bin
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/podium-postgres" --auth=trust
          if ! "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/podium-postgres" -l "$RUNNER_TEMP/podium-postgres.log" -o "-h 127.0.0.1 -p 5432 -k $RUNNER_TEMP/podium-postgres" -w start; then
            cat "$RUNNER_TEMP/podium-postgres.log"
            exit 1
          fi
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
      - name: Install pinned Foundry
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/foundry.tar.gz" https://github.com/foundry-rs/foundry/releases/download/v1.8.0/foundry_v1.8.0_linux_amd64.tar.gz
          echo "8c8560de380d58d1ee145934427887b107182367600a3c33aa71f16f2ce7ac57  $RUNNER_TEMP/foundry.tar.gz" | sha256sum --check
          mkdir -p contracts/.toolchain/foundry-v1.8.0
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C contracts/.toolchain/foundry-v1.8.0
          echo "$GITHUB_WORKSPACE/contracts/.toolchain/foundry-v1.8.0" >> "$GITHUB_PATH"
      - run: forge install --root "$PWD/contracts" foundry-rs/forge-std@rev=bf647bd6046f2f7da30d0c2bf435e5c76a780c1b --no-git
      - run: forge build
        working-directory: contracts
      - run: npm run check:contracts
      - run: npm run api:build
      - run: npm --workspace @raceson/rewards-chain run test:integration
      - run: npm run check:rewards:db
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/podium-postgres/postmaster.pid" ]; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/podium-postgres" -m fast -w stop
          fi

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Scan complete history with pinned Gitleaks
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          node scripts/check-secret-scanner.mjs "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts='--all' .
