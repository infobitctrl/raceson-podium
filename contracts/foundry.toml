[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]
solc = "0.8.36"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ast = true
ffi = false
# Read only the three original vendor artifacts used by the Safe compatibility tests.
fs_permissions = [
  { access = "read", path = "node_modules/@safe-global/safe-contracts/build/artifacts/contracts/Safe.sol/Safe.json" },
  { access = "read", path = "node_modules/@safe-global/safe-contracts/build/artifacts/contracts/proxies/SafeProxy.sol/SafeProxy.json" },
  { access = "read", path = "node_modules/@safe-global/safe-contracts/build/artifacts/contracts/handler/CompatibilityFallbackHandler.sol/CompatibilityFallbackHandler.json" }
]

[profile.default.fuzz]
runs = 512
seed = "0x7369747261696c"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
